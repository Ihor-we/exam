<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON-файл</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #1e1e1e;
            color: #d4d4d4;
        }
        pre {
            background-color: #2b2b2b;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <h1>Содержимое файла driver_prices_cleaned.json</h1>
    <pre id="jsonContent">Загрузка данных...</pre>

    <script>
        const JSON_URL = 'driver_prices_cleaned.json';

        // Функция для загрузки и отображения JSON
        async function loadAndDisplayJSON() {
            try {
                // Загружаем файл
                const response = await fetch(JSON_URL);
                
                // Проверяем, что ответ успешный (статус 200 OK)
                if (!response.ok) {
                    throw new Error(`Ошибка загрузки: ${response.status} ${response.statusText}`);
                }
                
                // Преобразуем ответ в формат JSON
                const data = await response.json();
                
                // Находим элемент на странице и вставляем отформатированный JSON
                document.getElementById('jsonContent').textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                // Обрабатываем ошибки (например, если файл не найден)
                document.getElementById('jsonContent').textContent = `Ошибка: ${error.message}`;
                console.error('Ошибка загрузки JSON:', error);
            }
        }

        // Запускаем функцию при загрузке страницы
        loadAndDisplayJSON();
    </script>

</body>
</html>
